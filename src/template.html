<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>财经日历 · 开源版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#ececed;--line:#e2e2e4;--ink:#1d1d1f;--ink2:#86868b;--ink3:#b0b0b5;
  --blue:#0a84ff;--purple:#af52de;--green:#34c759;--orange:#ff9500;--cyan:#5ac8fa;
  --red:#ff3b30;--hover:#f4f4f6;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--ink);background:#fff;
  display:flex;overflow:hidden;font-size:13px;
}
button{font-family:inherit}

/* ── 侧栏 ───────────────────────────── */
.sidebar{width:200px;flex:0 0 200px;background:var(--sb);display:flex;flex-direction:column;border-right:1px solid #dadade}
.sb-top{height:52px;display:flex;align-items:center;gap:9px;padding:0 14px;flex:0 0 52px}
.lights{display:flex;gap:6px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.sb-icons{display:flex;gap:10px;margin-left:4px;color:#6e6e73}
.sb-icons svg{width:15px;height:15px;display:block}
.sb-body{flex:1;overflow-y:auto;padding:2px 10px 6px}
.sb-body::-webkit-scrollbar{width:0}
.grp{font-size:11px;color:#86868b;font-weight:600;padding:12px 6px 4px;letter-spacing:.2px}
.calrow{display:flex;align-items:center;gap:9px;height:29px;padding:0 6px;border-radius:5px;cursor:pointer;user-select:none}
.calrow:hover{background:rgba(0,0,0,.055)}
.cdot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;transition:opacity .15s}
.calrow.off .cdot{opacity:.28}
.calrow.off .nm{color:#b0b0b5}
.calrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calrow .cnt{color:#a1a1a6;font-size:10.5px;font-variant-numeric:tabular-nums}
.watchbtn{display:flex;align-items:center;gap:6px;margin:1px 0 0 15px;padding:4px 7px;border-radius:5px;font-size:11.5px;color:#8e8e93;cursor:pointer;user-select:none}
.watchbtn:hover{background:rgba(0,0,0,.055);color:#3c3c43}
.watchbtn b{color:#C0550F;font-weight:600}
.watchbtn .aw{margin-left:auto;color:#c0c0c5}

/* 迷你月历 */
.mini{padding:6px 14px 12px;user-select:none}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:11px;color:#6e6e73}
.mini-h b{font-weight:600;font-size:11.5px;color:#48484a}
.mini-h span{cursor:pointer;padding:0 3px;color:#86868b}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#3c3c43;gap:1px 0;font-variant-numeric:tabular-nums}
.mini-g div{height:17px;line-height:17px}
.mini-g .wd{color:#a8a8ad}
.mini-g .out{color:#c2c3c7}
.mini-g .now{background:var(--red);color:#fff;border-radius:50%;width:17px;height:17px;line-height:17px;margin:0 auto;font-weight:600}
.mini-foot{margin-top:8px;display:flex;gap:6px}
.mini-foot button{flex:1;border:1px solid #d6d6da;background:#fff;border-radius:5px;font-size:10.5px;color:#48484a;padding:4px 0;cursor:pointer}
.mini-foot button:hover{background:#f7f7f9}
.mini-note{margin-top:6px;font-size:9.5px;color:#b0b0b6;text-align:center;letter-spacing:.2px}

/* ── 主区 ───────────────────────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.toolbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 18px}
.addbtn{width:27px;height:27px;border-radius:6px;border:1px solid #d8d8dc;background:#fff;color:#48484a;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:1px}
.addbtn:hover{background:#f4f4f6}
.mobtn{display:none;border:1px solid #d8d8dc;background:#fff;border-radius:6px;height:27px;padding:0 9px;font-size:12px;color:#48484a;cursor:pointer;font-family:inherit;white-space:nowrap}
.mobtn:hover{background:#f4f4f6}
.seg{margin:0 auto;display:flex;background:#eaeaec;border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;font-size:12.5px;color:#3c3c43;padding:4px 15px;border-radius:5px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.13),0 0 0 .5px rgba(0,0,0,.05);font-weight:500}
.search{position:relative}
.search input{width:190px;height:27px;border-radius:6px;border:1px solid #dcdce0;background:#fafafa;padding:0 9px 0 27px;font-size:12.5px;font-family:inherit;outline:none}
.search input:focus{background:#fff;border-color:#b9b9c0}
.search svg{position:absolute;left:8px;top:7px;width:13px;height:13px;color:#8e8e93}
.sres{position:absolute;top:32px;right:0;width:280px;background:#fff;border-radius:8px;box-shadow:0 8px 26px rgba(0,0,0,.16);max-height:300px;overflow:auto;z-index:40;display:none}
.sres.on{display:block}
.sres .it{padding:7px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid #f2f2f4}
.sres .it:hover{background:#f4f4f7}
.sres .it span{color:#8e8e93;font-size:11px;margin-left:6px}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px 8px}
.hdr h1{font-size:31px;font-weight:700;letter-spacing:-.6px}
.hdr .sub{font-size:11px;color:#a1a1a6;margin-left:10px;font-weight:400;letter-spacing:0;cursor:pointer;padding:2px 6px;border-radius:5px}
.hdr .sub:hover{background:#f4f4f6;color:#6e6e73}
.nav{display:flex;align-items:center;gap:1px}
.nav button{border:0;background:transparent;color:var(--blue);font-size:13px;padding:5px 9px;border-radius:6px;cursor:pointer}
.nav button:hover{background:#f0f0f3}
.nav svg{width:11px;height:11px}

.wk{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.wk div{text-align:center;font-size:12px;color:#48484a;padding:7px 0 8px;font-weight:600}

.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));border-left:1px solid var(--line);min-height:0;overflow:hidden}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;padding:24px 4px 3px;overflow:hidden;cursor:pointer;min-height:0;display:flex;flex-direction:column;gap:1.5px}
.cell:hover{background:#fafafb}
.cell.we{background:#fbfbfc}
.cell.out{background:#f9f9fa}
.cell.sel{background:#f0f0f5}
.cell .ln{position:absolute;top:3px;left:6px;font-size:10.5px;color:#a8a8ad;letter-spacing:.1px;white-space:nowrap}
.cell .ln.red{color:var(--red)}
.cell .dn{position:absolute;top:1px;right:6px;font-size:14.5px;color:#1d1d1f;font-weight:500;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.cell.out .dn{color:#bfc0c4;font-weight:400}
.cell.today .dn{background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-weight:600;font-size:13px;right:4px;top:1px}
.ev{height:15px;line-height:15px;border-radius:3.5px;font-size:10.5px;padding:0 4px 0 4.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1d1d1f;flex:0 0 15px;font-weight:400}
.ev.more{color:#96969b;font-size:10px;height:13px;line-height:13px;padding-left:5px;background:none!important}

/* 周 / 日 / 年 视图 */
.listview{flex:1;overflow:auto;padding:10px 20px 24px;min-height:0}
.weekwrap{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:100%}
.wcol{background:#fff;padding:8px 7px;min-height:160px}
.wcol h4{font-size:13px;color:#1d1d1f;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.wcol h4 b{color:var(--red)}
.dcell{font-size:11px;padding:3px 5px 3px 5px;border-radius:4px;margin-bottom:3px;color:#1d1d1f;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daylist .it{display:flex;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;align-items:flex-start}
.daylist .it:hover{background:#f6f6f8}
.daylist .tm{width:52px;color:#8e8e93;font-size:11.5px;padding-top:1px}
.daylist .bar{width:3px;border-radius:2px;align-self:stretch;min-height:16px}
.daylist .tx b{font-size:13px;font-weight:500;display:block}
.daylist .tx span{font-size:11px;color:#8e8e93}
.yearwrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ym{font-size:10px}
.ym h4{font-size:11.5px;font-weight:600;color:#3c3c43;margin-bottom:5px}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;color:#6e6e73}
.ym .g div{height:16px;line-height:16px;font-size:9.5px;border-radius:3px;cursor:pointer}
.ym .g .od{color:#c6c6ca}
.ym .g .has{background:#e6f0ff;color:#0a6cd6;font-weight:600}
.ym .g .now{background:var(--red);color:#fff}

/* ── 抽屉 ───────────────────────────── */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .2s;z-index:45}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:348px;background:#fff;box-shadow:-6px 0 30px rgba(0,0,0,.13);transform:translateX(102%);transition:transform .24s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;z-index:50}
.drawer.open{transform:none}
.dr-h{padding:16px 18px 10px;border-bottom:1px solid #efeff1;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dr-h .dt{font-size:19px;font-weight:700;letter-spacing:-.3px}
.dr-h .dd{font-size:11.5px;color:#8e8e93;margin-top:3px}
.dr-h .x{border:0;background:#f2f2f4;width:24px;height:24px;border-radius:50%;color:#6e6e73;font-size:14px;cursor:pointer;line-height:1;flex:0 0 24px}
.dr-h .x:hover{background:#e8e8ea}
.dr-b{flex:1;overflow-y:auto;padding:12px 18px 20px}
.evrow{display:flex;gap:9px;padding:9px 8px;border-radius:7px;cursor:pointer;align-items:flex-start;margin:0 -8px}
.evrow:hover{background:#f6f6f8}
.evrow .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 9px}
.evrow .bd{flex:1;min-width:0}
.evrow .bd b{font-size:13px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow .bd span{font-size:11px;color:#8e8e93}
.tag{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;background:#f2f2f4;color:#6e6e73;margin-left:5px;vertical-align:1px}
.tag.est{background:#fff3e0;color:#b26a00}
.tag.cf{background:#e6f6ea;color:#1d8a3c}
.add2{width:100%;margin-top:12px;border:1px dashed #d2d2d8;background:#fafafb;border-radius:7px;padding:9px;font-size:12.5px;color:#5a5a60;cursor:pointer}
.add2:hover{background:#f4f4f7;border-color:#bdbdc5}
.empty{color:#a1a1a6;font-size:12.5px;padding:18px 0;text-align:center}

/* ── 关注公司面板 ─────────────────── */
.wlist{border:1px solid #eeeef1;border-radius:8px;overflow:hidden;margin-bottom:16px}
.wrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-top:1px solid #f2f2f4;font-size:12.5px}
.wrow:first-child{border-top:0}
.wrow.off{background:#fbfbfc}
.wrow i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.wrow .wn{flex:1;min-width:0}
.wrow .wn b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow.off .wn b{color:#c2c2c7;font-weight:400}
.wrow .wn span{font-size:10.5px;color:#a1a1a6}
.wrow .wd{font-size:10.5px;color:#8e8e93;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.wrow.off .wd{color:#d0d0d5}
.wrow .x2{border:0;background:#f2f2f4;color:#8e8e93;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;flex:0 0 20px}
.wrow .x2:hover{background:#ffe9e6;color:#ff3b30}
.wrow .x2.plus:hover{background:#fff1e7;color:#C0550F}
.wadd{display:flex;gap:6px}
.wadd input{border:1px solid #dcdce0;border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none;background:#fff;color:var(--ink);min-width:0;flex:1}
.wadd input:focus{border-color:#FF9A62;box-shadow:0 0 0 3px rgba(255,154,98,.18)}
.wadd input[type=date]{flex:0 0 132px}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:#8e8e93;margin-bottom:4px;font-weight:500}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld select,.fld textarea{
  width:100%;border:1px solid #dcdce0;border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.13)}
.fld textarea{resize:vertical;min-height:52px;line-height:1.45}
.row2{display:flex;gap:8px}
.row2>div{flex:1}
.sw{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#3c3c43;cursor:pointer}
.sw input{width:15px;height:15px;accent-color:#0a84ff}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;border-radius:7px;padding:9px;font-size:13px;cursor:pointer;border:1px solid transparent}
.primary{background:#0a84ff;color:#fff;font-weight:500}
.primary:hover{background:#0874e0}
.ghost{background:#f2f2f4;color:#3c3c43}
.ghost:hover{background:#e9e9ec}
.danger{background:#fff;color:var(--red);border-color:#ffd0cd!important}
.danger:hover{background:#fff5f4}
.ro{background:#fff8e8;border:1px solid #ffe2b0;color:#8a5a00;font-size:11.5px;padding:8px 10px;border-radius:6px;margin-bottom:12px;line-height:1.5}
.hint{font-size:11px;color:#a1a1a6;line-height:1.5;margin-top:-4px}

/* ── 财报详情三段 ───────────────── */
.sec{margin-top:16px}
.sec:first-of-type{margin-top:12px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:11px;color:#8e8e93;font-weight:600;letter-spacing:.3px;margin-bottom:8px;white-space:nowrap}
.sec-h i{font-style:normal;font-size:9.5px;color:#b0b0b5;font-weight:400}
.sec-h::after{content:"";flex:1;height:1px;background:#f0f0f3;min-width:12px}
/* ── 市场预期：三块子结构 ── */
.sub{margin-bottom:15px}
.sub:last-child{margin-bottom:2px}
.sub-h{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#3c3c43;font-weight:600;margin:0 0 6px;letter-spacing:.2px}
.sub-h b{font-size:9px;font-weight:700;color:#B4690E;background:#FFF1E6;border-radius:4px;padding:1.5px 4px;letter-spacing:.3px}
.sub-h i{font-style:normal;font-weight:400;font-size:9.5px;color:#a1a1a6;margin-left:auto}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;min-width:0}
.vcell{background:#fafafb;border:1px solid #f0f0f3;border-radius:8px;padding:7px 9px;min-width:0}
.vcell .mk{display:block;font-size:9.5px;color:#8e8e93;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcell .mv{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.3px;color:#1d1d1f;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcell .mv em{font-style:normal;font-size:9px;font-weight:400;color:#8e8e93;margin-left:2px}
.vcell .mv.up{color:#0B7A56}
.vcell .mv.down{color:#C0392B}
.vcell .ms{display:block;font-size:9px;color:#a1a1a6;margin-top:3px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;background:#f0f0f3}
.rbar i{display:block;height:100%}
.rleg{display:flex;gap:10px;font-size:9px;color:#8e8e93;margin-top:5px}
.rleg span{display:flex;align-items:center;gap:3px}
.rleg i{width:5px;height:5px;border-radius:50%}
.etab{min-width:0}
.etab.act .erow{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) 46px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto 54px 52px;gap:6px;align-items:baseline;padding:6px 0;border-top:1px solid #f2f2f4;font-size:11.5px}
.erow.eh{border-top:0;padding:0 0 4px;font-size:9px;color:#a1a1a6}
.erow .ek{color:#3c3c43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .ev{font-weight:600;color:#1d1d1f;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.erow .ev em{font-style:normal;font-size:9px;font-weight:400;color:#8e8e93;margin-left:2px}
.erow .ey{font-size:10.5px;text-align:right;color:#0B7A56;font-variant-numeric:tabular-nums;white-space:nowrap}
.erow .ey.neg{color:#C0392B}
.erow .en{font-size:8.5px;color:#a1a1a6;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow.eh span{text-align:right}
.erow.eh span:first-child{text-align:left}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;min-width:0}
.mcell.wide{grid-column:1/-1}
.mcell{background:#fafafb;border:1px solid #f0f0f3;border-radius:8px;padding:7px 9px;min-width:0}
.mcell .mk{display:block;font-size:9.5px;color:#8e8e93;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell .mv{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.3px;color:#1d1d1f;font-variant-numeric:tabular-nums;line-height:1.2}
.mcell .mv em{font-style:normal;font-size:9.5px;font-weight:400;color:#8e8e93;margin-left:2px;letter-spacing:0}
.mcell .ms{display:block;font-size:9.5px;color:#a1a1a6;margin-top:3px;line-height:1.35}
.basis{font-size:9.5px;color:#b0b0b5;margin-top:7px;line-height:1.5}
.flist{list-style:none}
.flist li{position:relative;padding-left:12px;font-size:12px;line-height:1.6;color:#3c3c43;margin-bottom:5px}
.flist li::before{content:"";position:absolute;left:1px;top:6px;width:4px;height:4px;border-radius:50%;background:#FF9A62}
.ph{background:#fafafb;border:1px dashed #e4e4e8;border-radius:8px;padding:10px 12px;font-size:12px;color:#8e8e93;line-height:1.5}
.ph span{display:block;font-size:10px;color:#b0b0b5;margin-top:4px;line-height:1.5}
.pill{display:inline-block;font-size:9.5px;padding:2.5px 7px;border-radius:999px;background:#f2f2f4;color:#6e6e73;letter-spacing:.2px}
/* 财报结果沿用 A 股口径：超预期红、不及预期绿 */
.pill.ok{background:#FFEBE9;color:#D70015}
.pill.est{background:#fff3e0;color:#b26a00}
.pill.me{background:#f2f2f4;color:#6e6e73}
.pill.bad{background:#E8F8EC;color:#0E8A46}
.pill.fin{background:#FFF3B0;color:#2E2A1E}

/* ── 刷新按钮 / 数据状态 / 导入面板 ── */
.nav .rfbtn{border:1px solid #d8d8dd;background:#fff;border-radius:999px;font-family:inherit;font-size:12px;color:#3c3c43;padding:4px 12px;cursor:pointer;margin:0 9px 0 0;line-height:1.4;white-space:nowrap}
.nav .rfbtn:hover{border-color:#b8b8bf;background:#fafafb;color:#1d1d1f}
.nav .rfbtn.spin{color:#8e8e93;animation:rpulse 1s ease-in-out infinite}
@keyframes rpulse{50%{opacity:.45}}

<script>
/* ── 内置数据（构建时内联，替换 data/ 下四个 json） ── */
const DATA = __DATA__;
const SEED = DATA.events || [];
const EARN = DATA.earnings || {items:[]};
const FIN  = DATA.finance  || {items:[]};
const COMP = DATA.companies || {companies:{}};
const MACRO = (DATA.macro && DATA.macro.templates) || [];

/* 官方日程 / 实际业绩 / 行情：构建时内联一份快照，运行时可被 fetch 覆盖 */
const SCHED0 = DATA.schedule || {items:[], sources:[], updated:""};
let   SCHED = {items:(SCHED0.items||[]).slice(), sources:SCHED0.sources||[], updated:SCHED0.updated||""};
let   ACTS  = Object.assign({}, (DATA.actuals && DATA.actuals.items) || {});
let   QTS   = Object.assign({}, (DATA.quotes  && DATA.quotes.items)  || {});
/* 用户自己在页面里录/导入的，覆盖内置快照 */
let   MYACT = {};
let   MYQ   = {};
const RELS0 = (DATA.releases && DATA.releases.items) || {};
let   RELS  = Object.assign({}, RELS0);
let   MYREL = {};      // 页面里录/改的公布结果，key = tid@日期

/* 「今天」用运行时日期：部署后页面是静态的，不能靠构建日期 */
const TODAY = (function(){ const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
})();
const BUILT_ON = "__TODAY__";
const EARN_UPD = (DATA.earnings && DATA.earnings.updated) || "";
const KEY = "fincal.v1";

const CALS = {
  work:    {n:"工作",     c:"#007AFF", bg:"#E3EFFF"},
  holiday: {n:"节假日",   c:"#34C759", bg:"#E8F8EC"},
  personal:{n:"个人事项", c:"#5AC8FA", bg:"#E2F5FE"},
  other:   {n:"提醒事项", c:"#FF3B30", bg:"#FFE6E4"},
  finance: {n:"财经事件", c:"#F5C518", ro:true, bg:"#FFF3B0"},
  earnings:{n:"财报日历", c:"#FF9A62", ro:true, bg:"#FFEBDD"}
};
const CALORDER = ["work","holiday","personal","other","finance","earnings"];
/* 事件条统一浅底 + 左侧主色细条 + 近黑字；财报已披露的按超预期红 / 低于预期绿（A股红涨绿跌） */
function chipStyle(c, e){
  let fg = "#1d1d1f";
  if(e && e.c==="earnings"){
    if(e.verdict==="beat") fg = "#D70015";
    else if(e.verdict==="miss") fg = "#0E8A46";
  }
  return "background:"+(c.bg||"#F2F2F5")+";color:"+fg+";border-left:2.5px solid "+c.c+";";
}

const pad = n => String(n).padStart(2,"0");
const fmt = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const WD = ["周日","周一","周二","周三","周四","周五","周六"];

/* ── 农历 ───────────────────────────── */
const DN = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
            "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
            "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
let lunarF = null;
try { lunarF = new Intl.DateTimeFormat("zh-CN-u-ca-chinese",{month:"long",day:"numeric"}); } catch(e){}
function lunarLabel(d){
  if(!lunarF) return "";
  try{
    const p = lunarF.formatToParts(d);
    const mon = (p.find(x=>x.type==="month")||{}).value||"";
    const raw = (p.find(x=>x.type==="day")||{}).value||"";
    let n = parseInt(String(raw).replace(/[^\d]/g,""),10);
    if(!n){
      // 少数实现返回中文日名
      const i = DN.indexOf(String(raw).trim());
      if(i>=0) n = i+1;
    }
    if(!n) return mon;
    if(n===1) return mon+"初一";
    return DN[n-1] || "";
  }catch(e){ return ""; }
}

/* ── 状态 ───────────────────────────── */
const state = {
  view: new Date(),
  mode: "month",
  sel: TODAY,
  hidden: new Set(),
  events: [],
  fired: [],
  co: {},          // 公司覆盖表：{名称: {deleted} | {custom, ticker, market, biz, focus[], earnings[]}}
  subs: [],        // 订阅的宏观模板 id（日期随官方日程自动更新）
  editing: null
};

/* ── 公司库：内置 JSON + 用户覆盖 ───────── */
function baseCo(n){ return (COMP.companies||{})[n] || null; }

function guessMarket(tk){
  tk = String(tk||"").toUpperCase();
  if(!tk) return "";
  if(/\.HK$/.test(tk)) return "港股";
  if(/\.(SS|SZ|SH)$/.test(tk) || /^\d{6}$/.test(tk)) return "A股";
  return "美股";
}

/* 从内置财报数据反查代码 */
function tickerOf(n){
  const it = (EARN.items||[]).find(x=>x.company===n && x.ticker);
  return it ? it.ticker : "";
}

/* 合并后的公司元信息 */
function coMeta(n){
  const b = baseCo(n) || {};
  const ov = state.co[n] || {};
  const tk = ov.ticker || tickerOf(n) || "";
  return {
    name: n,
    ticker: tk,
    market: ov.market || guessMarket(tk),
    biz: ov.biz !== undefined ? ov.biz : (b.biz || ""),
    focus: ov.focus || b.focus || [],
    extraDates: ov.earnings || [],
    custom: !b
  };
}

/* 当前有效公司：内置（未删）+ 用户新增 */
function companyNames(){
  const out = [];
  const base = COMP.companies || {};
  Object.keys(base).forEach(n=>{ if(!(state.co[n]||{}).deleted) out.push(n); });
  Object.keys(state.co).forEach(n=>{
    const ov = state.co[n]||{};
    if(ov.deleted || !ov.custom) return;
    if(base[n] || out.indexOf(n)>=0) return;
    out.push(n);
  });
  return out;
}
function watchedCount(){ return companyNames().length; }

function earnEvents(){
  const out = [];
  const alive = new Set(companyNames());
  (EARN.items||[]).forEach((it,i)=>{
    if(!alive.has(it.company)) return;
    out.push({id:"e"+i, d:it.d, s:"", e:"", t:it.title, c:"earnings", a:true,
      n:(it.note||"")+(it.ticker?"　·　"+it.ticker:"")+(it.src?"　·　来源："+it.src:""),
      ro:true, status:it.status, co:it.company, raw:it,
      verdict:(it.actual&&it.actual.verdict)||""});
  });
  /* 用户给公司补充的财报日（内置公司也能补） */
  companyNames().forEach(n=>{
    coMeta(n).extraDates.forEach((x,i)=>{
      if(!x.d) return;
      out.push({id:"x"+n+"#"+i, d:x.d, s:"", e:"",
        t:x.title || (n+" 财报"), c:"earnings", a:true,
        n:(x.note || "手动添加的财报日"), ro:true,
        status:x.status || "estimated", co:n, customDate:true, ci:i});
    });
  });
  return out;
}

/* 财经事件：① 官方日程订阅（自动，只读）② 内置 finance.json（IPO/并购等个案） */
function tplOf(id){ return MACRO.find(t=>t.id===id) || null; }
function schedOf(tid){
  return SCHED.items.filter(x=>x.tid===tid)
    .sort((a,b)=>(a.d+(a.t||"")).localeCompare(b.d+(b.t||"")));
}
function nextSchedOf(tid){
  const up = schedOf(tid).filter(x=>x.d >= TODAY);
  return up.length ? up[0] : null;
}
function srcName(id){
  const s = (SCHED.sources||[]).find(x=>x.id===id);
  return s ? s.name : id;
}


/* 公布结果：key = 模板id@公布日。官方抓的 + 页面录的 */
function relKey(tid, d){ return tid + "@" + d; }
function relOf(tid, d){
  const k = relKey(tid, d);
  return MYREL[k] || RELS[k] || null;
}
function prevRelOf(tid, d){
  const keys = Object.keys(RELS).concat(Object.keys(MYREL))
    .filter(k=>k.indexOf(tid+"@")===0 && k.split("@")[1] < d).sort();
  const k = keys[keys.length-1];
  if(!k) return null;
  return MYREL[k] || RELS[k] || null;
}
function relCount(){ return Object.keys(RELS).length + Object.keys(MYREL).filter(k=>!RELS[k]).length; }

function financeEvents(){
  const out = [];
  const subs = state.subs || [];
  SCHED.items.forEach((it,i)=>{
    if(subs.indexOf(it.tid)<0) return;
    const tp = tplOf(it.tid);
    out.push({id:"g"+i, d:it.d, s:it.t||"", e:"", t:(tp && tp.name) || it.name || it.tid,
      c:"finance", a:!it.t,
      n:(it.note||"")+(it.period?"　·　"+it.period:"")+
        (it.t?"　·　北京时间":"")+(it.src?"　·　"+srcName(it.src):""),
      ro:true, official:true, sched:it, tid:it.tid,
      url:it.url||"", imp:it.imp||(tp&&tp.imp)||"mid"});
  });
  (FIN.items||[]).forEach((it,i)=>{
    out.push({id:"f"+i, d:it.d, s:it.s||"", e:it.e||"", t:it.t, c:"finance", a:!it.s,
      n:(it.note||"")+(it.company?"　·　"+it.company:"")+(it.src?"　·　来源："+it.src:""),
      ro:true, co:it.company||"", kind:it.kind||"", raw:it});
  });
  return out;
}

const DEFAULT_SUBS = ["us-fomc","us-cpi","us-nfp","cn-cpi","cn-activity"];

function loadStore(){
  let raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{
      const o = JSON.parse(raw);
      state.events = (o.events || []).map(migrate);
      state.fired = o.fired || [];
      state.hidden = new Set(o.hidden || []);
      state.co = o.co || {};
      state.subs = Array.isArray(o.subs) ? o.subs : DEFAULT_SUBS.slice();
      MYACT = o.myact || {};
      MYQ = o.myq || {};
      MYREL = o.myrel || {};
      return;
    }catch(e){}
  }
  state.events = SEED.map(e=>migrate({...e, remind:0})).map((e,i)=>({id:"s"+i, ...e}));
  state.subs = DEFAULT_SUBS.slice();
  save();
}

// 旧的 Home 分类并入「个人事项」
function migrate(e){
  if(e.c==="home") e.c = "personal";
  return e;
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      events: state.events, fired: state.fired,
      hidden:[...state.hidden], co: state.co,
      subs: state.subs, myact: MYACT, myq: MYQ, myrel: MYREL
    }));
  }catch(e){}
}

/* ── 事件取用 ───────────────────────── */
function allEvents(){
  return state.events.concat(financeEvents(), earnEvents());
}
function eventsOf(key){
  return allEvents().filter(e=>e.d===key && !state.hidden.has(e.c))
    .sort((a,b)=>{
      const fa=a.c==="finance"?0:1, fb=b.c==="finance"?0:1;
      if(fa!==fb) return fa-fb;
      if(a.a!==b.a) return a.a?-1:1;
      const ta=a.s||"", tb=b.s||"";
      if(ta!==tb) return ta.localeCompare(tb);
      if(a.c==="earnings" && b.c==="earnings"){
        const ca = a.co||"", cb = b.co||"";
        if(ca!==cb) return ca.localeCompare(cb);
      }
      return a.t.localeCompare(b.t);
    });
}

/* ── 月视图 ─────────────────────────── */
function matrix(y,m){
  const first = new Date(y,m,1);
  const lead = (first.getDay()+6)%7;
  const start = new Date(y,m,1-lead);
  const out=[];
  for(let i=0;i<42;i++) out.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));
  return out;
}

function renderMonth(){
  const y = state.view.getFullYear(), m = state.view.getMonth();
  const cells = matrix(y,m);
  let h = '<div class="wk">'+["周一","周二","周三","周四","周五","周六","周日"].map(x=>'<div>'+x+'</div>').join("")+'</div>';
  h += '<div class="grid">';
  cells.forEach(d=>{
    const k = fmt(d);
    const out = d.getMonth()!==m;
    const evs = eventsOf(k);
    const show = evs.slice(0,4);
    const cls = ["cell"];
    if(out) cls.push("out");
    if(d.getDay()===0 || d.getDay()===6) cls.push("we");
    if(k===TODAY) cls.push("today");
    if(k===state.sel) cls.push("sel");
    const ll = lunarLabel(d);
    const isL1 = /初一$/.test(ll);
    let inner = '<div class="ln'+(isL1?" red":"")+'">'+ll+'</div><div class="dn">'+d.getDate()+'</div>';
    show.forEach(e=>{
      const c = CALS[e.c]||CALS.other;
      inner += '<div class="ev" style="'+chipStyle(c,e)+'" data-id="'+e.id+'">'+esc(e.t)+'</div>';
    });
    if(evs.length>4) inner += '<div class="ev more">+'+(evs.length-4)+'</div>';
    if(evs.length){
      inner += '<div class="dots">' + evs.slice(0,3).map(e=>{
        const c = CALS[e.c]||CALS.other;
        return '<i style="background:'+c.c+'"></i>';
      }).join("") + (evs.length>3 ? '<i class="mo">+'+(evs.length-3)+'</i>' : '') + '</div>';
    }
    h += '<div class="'+cls.join(" ")+'" data-d="'+k+'">'+inner+'</div>';
  });
  h += '</div>';
  document.getElementById("viewHost").innerHTML = h;

  document.querySelectorAll(".cell").forEach(el=>{
    el.onclick = ev=>{
      const id = ev.target.dataset && ev.target.dataset.id;
      if(id){ ev.stopPropagation(); openEvent(id, el.dataset.d); return; }
      selectDay(el.dataset.d);
    };
    el.ondblclick = ev=>{
      if(ev.target.dataset && ev.target.dataset.id) return;
      openForm(null, el.dataset.d);
    };
  });
}

/* ── 周视图 ─────────────────────────── */
function renderWeek(){
  const base = state.view;
  const lead = (base.getDay()+6)%7;
  const start = new Date(base.getFullYear(),base.getMonth(),base.getDate()-lead);
  let h = '<div class="listview"><div class="weekwrap">';
  for(let i=0;i<7;i++){
    const d = new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const k = fmt(d);
    const evs = eventsOf(k);
    h += '<div class="wcol" data-d="'+k+'"><h4><span>'+WD[d.getDay()]+'</span><b'+(k===TODAY?' style="color:#ff3b30"':'')+'>'+(d.getMonth()+1)+'/'+d.getDate()+'</b></h4>';
    if(!evs.length) h += '<div style="color:#c6c6ca;font-size:10.5px">—</div>';
    evs.forEach(e=>{
      const c = CALS[e.c]||CALS.other;
      h += '<div class="dcell" data-id="'+e.id+'" style="'+chipStyle(c,e)+'">'+(e.a?"":esc(e.s)+" ")+esc(e.t)+'</div>';
    });
    h += '</div>';
  }
  h += '</div></div>';
  document.getElementById("viewHost").innerHTML = h;
  document.querySelectorAll(".wcol").forEach(el=>{
    el.onclick = ev=>{
      const id = ev.target.dataset && ev.target.dataset.id;
      if(id){ ev.stopPropagation(); openEvent(id, el.dataset.d); return; }
      selectDay(el.dataset.d);
    };
  });
}

/* ── 年视图 ─────────────────────────── */
function renderYear(){
  const y = state.view.getFullYear();
  const has = new Set(allEvents().map(e=>e.d));
  let h = '<div class="listview"><div class="yearwrap">';
  for(let m=0;m<12;m++){
    h += '<div class="ym"><h4>'+(m+1)+'月</h4><div class="g">';
    ["一","二","三","四","五","六","日"].forEach(w=>h+='<div style="color:#b8b8bd;font-size:9px">'+w+'</div>');
    const cells = matrix(y,m);
    cells.forEach(d=>{
      const k = fmt(d);
      let cls = d.getMonth()!==m ? "od" : "";
      if(has.has(k)) cls += " has";
      if(k===TODAY) cls = "now";
      h += '<div class="'+cls+'" data-d="'+k+'">'+d.getDate()+'</div>';
    });
    h += '</div></div>';
  }
  h += '</div></div>';
  document.getElementById("viewHost").innerHTML = h;
  document.querySelectorAll(".ym .g [data-d]").forEach(el=>{
    el.onclick = ()=>{ state.view = parseD(el.dataset.d); state.mode="month";
      document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.v==="month"));
      render(); };
  });
}

/* ── 主渲染 ─────────────────────────── */
function render(){
  const y = state.view.getFullYear(), m = state.view.getMonth();
  let t = "";
  if(state.mode==="month") t = y+"年"+(m+1)+"月";
  else if(state.mode==="year") t = y+"年";
  else if(state.mode==="week"){
    const lead = (state.view.getDay()+6)%7;
    const s = new Date(y,m,state.view.getDate()-lead);
    const e2 = new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);
    t = (s.getMonth()+1)+"月"+s.getDate()+"日 – "+(e2.getMonth()+1)+"月"+e2.getDate()+"日";
  } else {
    const d = parseD(state.sel);
    t = (d.getMonth()+1)+"月"+d.getDate()+"日";
  }
  document.getElementById("title").textContent = t;
  const es = document.getElementById("earnSub");
  es.textContent = "财报日历 · 关注 "+watchedCount()+" 家 · 更新于 "+EARN_UPD;
  es.onclick = openWatch;
  es.title = "查看已关注公司";

  if(state.mode==="month") renderMonth();
  else if(state.mode==="week") renderWeek();
  else if(state.mode==="day") renderDay();
  else renderYear();

  renderMini();
}
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ── 抽屉：编辑表单 ─────────────────── */
function openEvent(id, dayKey){
  const all = allEvents();
  const e = all.find(x=>x.id===id);
  if(!e) return;
  if(e.ro){ if(e.c==="finance"){ showFinance(e, dayKey); return; } showReadonly(e, dayKey); return; }
  openForm(e, dayKey);
  if(state.mode==="month"||state.mode==="day") render();
}

/* ── 抽屉：关注公司 ─────────────────── */
function watchRows(){
  return companyNames().map(n=>{
    const m = coMeta(n);
    const ds = (EARN.items||[]).filter(x=>x.company===n).map(x=>x.d)
      .concat(m.extraDates.map(x=>x.d).filter(Boolean));
    return {name:n, ticker:m.ticker, market:m.market, ds, custom:m.custom};
  });
}
function nextOf(ds){
  const up = ds.filter(d=>d>=TODAY).sort();
  if(up.length) return up[0];
  const past = ds.slice().sort();
  return past.length ? past[past.length-1] : "";
}

/* 按代码反查内置公司名 */
function findByCode(tk){
  const t = String(tk||"").trim().toUpperCase();
  if(!t) return null;
  const it = (EARN.items||[]).find(x=>(x.ticker||"").toUpperCase()===t);
  return it ? it.company : null;
}

/* 打开某公司最近一次财报详情；没有日程就进资料表单 */
function openCoLatest(name){
  const evs = earnEvents().filter(e=>e.co===name).sort((a,b)=>a.d.localeCompare(b.d));
  const up = evs.filter(e=>e.d>=TODAY)[0] || evs[evs.length-1];
  if(up) showReadonly(up, up.d);
  else openCoForm(name);
}

function openWatch(){
  document.getElementById("drTitle").textContent = "财报日历 · 公司";
  document.getElementById("drSub").textContent = "已关注 "+watchedCount()+" 家 · 增删后日历与详情页同步";
  const rows = watchRows();

  let h = '<div class="fld" style="margin-bottom:14px"><label>添加公司</label>'
        +   '<div class="wadd"><input id="wCo" placeholder="公司名或代码，如 英伟达 / NVDA" maxlength="24"></div>'
        +   '<div class="wadd" style="margin-top:6px"><input id="wTk" placeholder="代码（可选，自动识别市场）" maxlength="16">'
        +   '<input id="wD" type="date" title="下次财报日（可选）"></div>'
        +   '<button class="add2" id="wAdd" style="margin-top:8px">+ 添加并生成详情页</button>'
        +   '<div class="sec-hint" style="margin-top:6px">内置资料库命中会带出业务结构与关注点；没命中就生成空白模板，加完点铅笔补全。</div>'
        + '</div>';

  h += '<div class="wlist">';
  if(!rows.length) h += '<div class="empty">还没有关注任何公司</div>';
  rows.forEach((r,i)=>{
    h += '<div class="wrow" data-i="'+i+'">'
       +   '<i style="background:#FF9A62"></i>'
       +   '<div class="wn"><b>'+esc(r.name)+'</b>'
       +     '<span>'+esc(r.ticker||"—")+(r.market?" · "+r.market:"")+(r.custom?"　自定义":"")+'</span></div>'
       +   '<div class="wd">'+(nextOf(r.ds)||"—")+'</div>'
       +   '<button class="x2 plus" data-edit="'+esc(r.name)+'" title="编辑公司资料">✎</button>'
       +   '<button class="x2" data-del="'+esc(r.name)+'" title="删除公司">✕</button>'
       + '</div>';
  });
  h += '</div>';
  h += '<div class="sec-hint">点铅笔改代码、业务结构与关注点，保存后详情页立即生效。删除只是移出你的日历，不改内置数据，重新添加即可恢复。</div>';

  const body = document.getElementById("drBody");
  body.innerHTML = h;
  openDrawer();

  body.querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick = ev=>{ ev.stopPropagation(); openCoForm(b.dataset.edit); };
  });
  body.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = ev=>{
      ev.stopPropagation();
      const n = b.dataset.del;
      if(!confirm("从日历中移除「"+n+"」？\n它的财报事件会一起隐藏，重新添加可恢复。")) return;
      if(baseCo(n)) state.co[n] = Object.assign({}, state.co[n]||{}, {deleted:true, custom:false});
      else delete state.co[n];
      save(); renderSidebar(); render(); openWatch();
      toast("已移除 "+n);
    };
  });

  document.getElementById("wAdd").onclick = ()=>{
    const raw = document.getElementById("wCo").value.trim();
    const tkRaw = document.getElementById("wTk").value.trim();
    const dd = document.getElementById("wD").value;
    if(!raw && !tkRaw){ toast("请填公司名或代码"); return; }

    /* 名称 / 代码 → 统一成公司名 */
    let name = raw || "";
    if(!name || (findByCode(raw))) name = findByCode(raw) || name;
    if(!name && tkRaw) name = findByCode(tkRaw) || tkRaw.toUpperCase();
    if(!name){ toast("请填公司名"); return; }

    if(companyNames().indexOf(name)>=0){
      toast(name+" 已在名单里，直接编辑即可");
      openCoForm(name); return;
    }

    const tk = tkRaw || (/^[A-Za-z0-9.\-]{1,10}$/.test(name)? name.toUpperCase() : "");
    if(baseCo(name)){
      /* 内置公司：解除删除标记 */
      state.co[name] = Object.assign({}, state.co[name]||{}, {deleted:false, custom:false});
    } else {
      state.co[name] = {custom:true, ticker:tk, market:guessMarket(tk)};
    }
    if(dd){
      const cur = state.co[name].earnings || [];
      if(!cur.some(x=>x.d===dd)) state.co[name].earnings = cur.concat([{d:dd, status:"estimated"}]);

/* ── 抽屉：关注财经事件（官方日程订阅 + 手工铺开） ── */
const FREQ = {month:"每月", quarter:"每季", week:"每周", year:"每年", once:"单次"};

/* 加 k 个月，自动收口到月末，避免 1/31 + 1 月跳到 3/3 */
function addMonths(d, k){
  const y = d.getFullYear(), m = d.getMonth()+k, day = d.getDate();
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(day, last));
}
function addPeriods(first, freq, n){
  const base = parseD(first);
  if(!base || isNaN(base.getTime())) return [];
  const out = [];
  for(let i=0;i<n;i++){
    let x;
    if(freq==="week")         x = new Date(base.getFullYear(), base.getMonth(), base.getDate()+7*i);
    else if(freq==="month")   x = addMonths(base, i);
    else if(freq==="quarter") x = addMonths(base, 3*i);
    else if(freq==="year")    x = addMonths(base, 12*i);
    else                      x = base;
    out.push(fmt(x));
    if(freq==="once") break;
  }
  return out;
}

/* 手工铺开的事件组：按 gid 聚合 */
function macroGroups(){
  const g = {};
  state.events.forEach(e=>{
    if(e.c!=="finance" || !e.gid) return;
    if(!g[e.gid]) g[e.gid] = {gid:e.gid, name:e.gt || e.t, dates:[]};
    g[e.gid].dates.push(e.d);
  });
  return Object.keys(g).map(k=>{
    const x = g[k];
    x.dates.sort();
    return x;
  }).sort((a,b)=> (a.dates[0]||"").localeCompare(b.dates[0]||""));
}

/* ── 详情页两种填写方式：本地文件夹 / 网上获取 ─────────────── */

/* 解析器：把任意文本（json / csv / md / txt / 网页正文）解析成公司档案 */
function parseProfile(text, fileName){
  const out = {focus:[], earnings:[], metrics:[], quote:null, src:fileName||""};
  const t = String(text||"").trim();
  if(!t) return out;

  /* 1) JSON */
  if(/^[\[{]/.test(t)){
    let o = null;
    try{ o = JSON.parse(t); }catch(e){ return out; }
    let rec = o;
    if(Array.isArray(o)) rec = o[0];
    else if(o.companies) rec = Object.values(o.companies)[0];
    else if(o.items && !o.ticker && !o.biz) rec = Array.isArray(o.items)?o.items[0]:o.items;
    if(rec && typeof rec === "object"){
      if(rec.ticker) out.ticker = String(rec.ticker);
      if(rec.name || rec.company) out.name = rec.name || rec.company;
      if(rec.market) out.market = rec.market;
      if(rec.biz) out.biz = rec.biz;
      if(Array.isArray(rec.focus)) out.focus = rec.focus.filter(Boolean).map(String);
      if(Array.isArray(rec.earnings)) out.earnings = rec.earnings.filter(x=>x&&x.d).map(x=>({d:x.d, note:x.note||""}));
      if(rec.d && rec.title) out.earnings.push({d:rec.d, note:rec.title});
      const act = rec.actual;
      if(act && Array.isArray(act.items)){
        out.metrics = act.items.map(m=>({k:m.k, a:m.v, e:m.e, u:m.u||"", yoy:m.yoy}));
        out.period = (rec.expect && rec.expect.est && rec.expect.est.period) || act.period || "";
      }
      if(rec.metrics) out.metrics = rec.metrics;
      if(rec.price) out.quote = rec.price;
      if(rec.report_date && !out.earnings.length) out.earnings.push({d:rec.report_date, note:"财报"});
      if(rec.period) out.period = rec.period;
      if(rec.note) out.note = rec.note;
      if(rec.focus || rec.biz || rec.ticker) return out;
    }
  }

  /* 2) CSV：按表头映射 */
  const lines = t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length > 1 && lines[0].includes(",")){
    const head = lines[0].split(",").map(s=>s.trim().toLowerCase());
    if(head.some(h=>/ticker|代码|symbol/.test(h))){
      const rows = lines.slice(1).map(l=>l.split(",").map(s=>s.trim()));
      const col = re => head.findIndex(h=>re.test(h));
      const ci = {tk:col(/ticker|代码|symbol/), nm:col(/name|名称|公司/), eps:col(/eps|每股/),
                  rev:col(/rev|营收|收入/), eeps:col(/est.*eps|eps.*est|预期.*eps/),
                  erev:col(/est.*rev|rev.*est|预期.*(营收|收入)/)};
      const r = rows[0] || [];
      if(ci.tk>=0 && r[ci.tk]) out.ticker = r[ci.tk];
      if(ci.nm>=0 && r[ci.nm]) out.name = r[ci.nm];
      if(ci.eps>=0 && r[ci.eps]) out.metrics.push({k:"每股收益", a:r[ci.eps], e:ci.eeps>=0?r[ci.eeps]:null, u:""});
      if(ci.rev>=0 && r[ci.rev]) out.metrics.push({k:"营业收入", a:r[ci.rev], e:ci.erev>=0?r[ci.erev]:null, u:""});
      return out;
    }
  }

  /* 3) 文本 / Markdown / 网页正文 */
  const grab = re => { const m = t.match(re); return m ? m[1].trim() : ""; };
  const tk = grab(/(?:股票代码|证券代码|代码|ticker|symbol)\s*[:：]?\s*([A-Z0-9]{2,10}(?:\.[A-Z]{2})?)/i)
           || grab(/\(([A-Z]{1,5})\)\s*(?:股价|股票|Nasdaq|NYSE)/);
  if(tk) out.ticker = tk.toUpperCase();
  const nm = grab(/^(?:公司名称|公司|企业名称)\s*[:：]\s*(.+)$/m);
  if(nm) out.name = nm;
  const biz = grab(/(?:业务结构|主营业务|业务构成|业务板块)\s*[:：]\s*(.+)$/m);
  if(biz) out.biz = biz.slice(0,120);

  /* 关注点：先找小标题，再取下面的列表行 */
  let block = "";
  const sec = t.match(/(?:核心关注点|关注点|投资要点|核心看点|关键指标)[^\n]*\n([\s\S]{0,600})/);
  if(sec) block = sec[1];
  (block ? block.split(/\n/) : lines).forEach(raw=>{
    const l = raw.trim();
    if(!/^([-*·•—]|\d+[.、)]|\(\d+\))/.test(l)) return;
    const item = l.replace(/^([-*·•—]|\d+[.、)]|\(\d+\))\s*/,"").trim();
    if(item.length > 3 && item.length < 120) out.focus.push(item);
  });

  /* 财报日 */
  const dm = t.match(/(20\d{2})[-/年](\d{1,2})[-/月](\d{1,2})/g) || [];
  dm.slice(0,8).forEach(s=>{
    const p = s.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
    if(p) out.earnings.push({d:`${p[1]}-${String(p[2]).padStart(2,"0")}-${String(p[3]).padStart(2,"0")}`, note:"来自导入文件"});
  });

  /* 实际值 */
  const eps = grab(/(?:每股收益|EPS|摊薄EPS)[^\d\-]{0,14}(-?[\d.]+)/i);
  const rev = grab(/(?:营业收入|营收|收入)[^\d\-]{0,14}([\d,.]+)/i);
  if(eps) out.metrics.push({k:"每股收益", a:eps, e:null, u:""});
  if(rev) out.metrics.push({k:"营业收入", a:rev.replace(/,/g,""), e:null, u:""});

  /* 去重 */
  const seen = {};
  out.focus = out.focus.filter(x=>{ if(seen[x]) return false; seen[x]=1; return true; });
  const dseen = {};
  out.earnings = out.earnings.filter(x=>{ if(dseen[x.d]) return false; dseen[x.d]=1; return true; });
  return out;
}

/* 把解析结果写进公司覆盖表 + 实际业绩 */
function applyProfile(name, p, mode){
  if(!name) return 0;
  const ov = state.co[name] || {};
  const patch = {custom: baseCo(name) ? false : true};
  if(p.ticker) patch.ticker = String(p.ticker).toUpperCase();
  if(p.market) patch.market = p.market;
  if(p.biz) patch.biz = p.biz;
  if(p.focus && p.focus.length) patch.focus = p.focus.slice(0,12);
  const dates = (ov.earnings||[]).slice();
  (p.earnings||[]).forEach(x=>{ if(!dates.some(y=>y.d===x.d)) dates.push({d:x.d, note:x.note||"", status:"imported"}); });
  if(dates.length) patch.earnings = dates;
  patch.src = mode==="web" ? "网上获取" : "本地文件";
  patch.filledAt = TODAY;
  state.co[name] = Object.assign({}, ov, patch);

  if(p.metrics && p.metrics.length){
    const tk = (patch.ticker || coMeta(name).ticker || name).toUpperCase();
    MYACT[tk] = {
      period: p.period || "", report_date: (p.earnings[0]||{}).d || "",
      metrics: p.metrics.map(m=>({k:m.k, a:num(m.a), e:num(m.e), u:m.u||"", yoy:m.yoy})),
      src: p.src, note: p.note || ""
    };
  }
  if(p.quote) MYQ[(patch.ticker||"").toUpperCase()] = p.quote;
  save(); renderSidebar(); render();
  return (p.focus||[]).length + (p.metrics||[]).length + (p.earnings||[]).length;
}

function profHTML(p, name){
  const rows = [];
  rows.push(['代码', p.ticker || '—']);
  rows.push(['市场', p.market || guessMarket(p.ticker||"") || '—']);
  rows.push(['业务结构', p.biz || '—']);
  rows.push(['关注点', (p.focus||[]).length ? p.focus.length+' 条' : '—']);
  rows.push(['财报日', (p.earnings||[]).length ? p.earnings.map(x=>x.d).join("、") : '—']);
  rows.push(['实际业绩', (p.metrics||[]).length ? p.metrics.map(m=>m.k+" "+(m.a===null||m.a===undefined?"—":m.a)).join("　") : '—']);
  let h = '';

/* 从新闻稿正文里捞数字：只认「名称 + 同比/环比 + 上涨/下降 + 数值%」这种句式 */
function parseReleaseText(t){
  const txt = String(t||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ");
  const out = [], seen = {};
  const re = /([\u4e00-\u9fa5]{2,12})(同比|环比)?(上涨|下降|增长|回落|持平)\s*([\d.]+)?\s*%/g;
  let m;
  while((m = re.exec(txt))){
    const name = (m[1]||"").trim().replace(/^(其中|分项|从|与|比|较|而|但)/,"");
    if(name.length < 2 || seen[name]) continue;
    const kind = m[3];
    const v = kind === "持平" ? 0 : Number(m[4]);
    if(!isFinite(v)) continue;
    seen[name] = 1;
    out.push({k:name + (m[2]||""), v: (kind==="下降"||kind==="回落") ? -v : v, u:"%"});
    if(out.length >= 8) break;
  }
  return out;
}

/* 抓一家公司的行情（浏览器直连，失败就走代理） */
async function fetchQuote(tk, cb, silent){
  const px = (()=>{ try{ return localStorage.getItem("fincal.proxy")||""; }catch(e){ return ""; } })();
  const sym = /^\d{6}$/.test(tk) ? tk + ".SS" : String(tk).toUpperCase();
  const url = "https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym)+"?range=3mo&interval=1d";
  if(!silent) toast("抓取 "+sym+" 行情…");
  const tries = px ? [px + encodeURIComponent(url), url] : [url];
  for(const u of tries){
    try{
      const r = await fetch(u, {cache:"no-store"});
      if(!r.ok) continue;
      const j = await r.json();
      const r0 = (j.chart.result||[])[0];
      const ts = r0.timestamp||[], cl = r0.indicators.quote[0].close||[];
      const pts = ts.map((t,i)=>[new Date(t*1000), cl[i]]).filter(x=>x[1]!=null);
      if(!pts.length) continue;
      const last = pts[pts.length-1], prev = pts[pts.length-2];
      MYQ[sym] = {report_date: "", pre: prev?prev[1]:null, close: last[1], next: null,
        chg: prev? +(((last[1]/prev[1])-1)*100).toFixed(2) : null, next_chg: null,
        asof: last[0].toISOString().slice(0,10), src:"yahoo"};
      save(); render();
      if(!silent) toast("拿到 "+sym+" 最近两个交易日收盘");
      if(cb) cb();
      return true;
    }catch(e){}
  }
  if(!silent) toast("抓不到（跨域或网络），可以直接手填");
  return false;
}

async function loadJSON(f){
  try{
    const r = await fetch("data/"+f+"?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

async function refreshAll(manual){
  const btn = document.getElementById("btnRefresh");
  if(btn){ btn.classList.add("spin"); btn.textContent = "刷新中"; }
  const http = /^https?:/.test(location.protocol);
  const log = [];

  if(http){
    const sc = await loadJSON("schedule.json");
    if(sc && Array.isArray(sc.items)){
      SCHED = {items:sc.items, sources:sc.sources||[], updated:sc.updated||""};
      log.push("日程 "+sc.items.length+" 条");
    }
    const ac = await loadJSON("actuals.json");
    if(ac && ac.items){ ACTS = Object.assign(ACTS, ac.items); log.push("业绩 "+Object.keys(ac.items).length+" 家"); }
    const qq = await loadJSON("quotes.json");
    if(qq && qq.items){ QTS = Object.assign(QTS, qq.items); log.push("行情 "+Object.keys(qq.items).length+" 家"); }
    const rl = await loadJSON("releases.json");
    if(rl && rl.items){ RELS = Object.assign(RELS, rl.items); log.push("公布结果 "+Object.keys(rl.items).length+" 条"); }
  }

  /* 已披露但还没行情的，顺手抓最近两家 */
  let got = 0;
  const need = (EARN.items||[]).filter(it=>it.d<=TODAY && it.ticker && !quoteOf(it.ticker)).slice(0,2);
  for(const it of need){
    if(await fetchQuote(it.ticker, null, true)) got++;
  }
  if(got) log.push("新抓行情 "+got+" 家");

  renderSidebar(); render();
  if(btn){ btn.classList.remove("spin"); btn.textContent = "刷新"; }
  const msg = log.length ? "已刷新：" + log.join(" · ")
    : (http ? "已刷新，数据没有变化"
            : "本地打开只能重绘；部署到网上（或跑 scripts/ 里的脚本）才会拉到最新");
  if(manual) toast(msg);
  return log;
}

/* ③ 实际业绩 + 预期差 + 股价反应 */
function num(x){
  if(x===null || x===undefined || x==="") return null;
  const v = Number(String(x).replace(/[,，\s]/g,""));
  return isFinite(v) ? v : null;
}
function actOf(ticker){ return (ticker && (MYACT[ticker] || ACTS[ticker])) || null; }
function quoteOf(ticker){ return (ticker && (MYQ[ticker] || QTS[ticker])) || null; }
function pct(a,e){
  if(a===null||e===null||e===0) return null;
  return (a-e)/Math.abs(e)*100;
}
function tkOf(e){
  const m = coMeta(e.co || "");
  return (e.raw && e.raw.ticker) || m.ticker || "";
}

/* 把三种来源（内置 actual / 页面录入 / 文件导入）统一成 [{k,a,e,u,yoy}] */
function metricsOf(e){
  const rec = actOf(tkOf(e));
  if(rec && rec.metrics && rec.metrics.length){
    return rec.metrics.map(m=>({k:m.k, a:num(m.a), e:num(m.e), u:m.u||"", yoy:(m.yoy===undefined?null:m.yoy)}));
  }
  const legacy = e.raw && e.raw.actual;
  if(legacy && legacy.items && legacy.items.length){
    return legacy.items.map(m=>({k:m.k, a:num(m.v), e:num(m.e), u:m.u||"", yoy:(m.yoy===undefined?null:m.yoy)}));
  }
  return [];
}

/* 结论：优先看每股收益的预期差，没有就看第一个有预期值的指标 */
function verdictFrom(metrics){
  const both = metrics.filter(m=>m.a!==null && m.e!==null);
  if(!both.length) return null;
  const eps = both.find(m=>/每股|EPS|摊薄/i.test(m.k)) || both[0];
  const s = pct(eps.a, eps.e);
  if(s===null) return null;
  return {k: s>2 ? "beat" : (s<-2 ? "miss" : "inline"), s, metric:eps};
}
const VLABEL = {beat:"超预期", miss:"低于预期", inline:"符合预期"};

function actualHTML(e){
  const metrics = metricsOf(e);
  if(!metrics.length){
    return '<div class="ph">待披露<span>财报发布后录入实际值，自动与上面的一致预期比对，标出超预期 / 低于预期 / 符合预期。</span></div>'
         + '<div class="tg"><button data-fill="'+esc(e.co||"")+'">录入实际业绩</button>'
         +   '<button data-import="'+esc(e.co||"")+'">从文件 / 网上获取</button></div>';
  }
  const v = verdictFrom(metrics);
  let h = '<div style="margin-bottom:8px">'
        + (v ? '<span class="verdict '+v.k+'">'+VLABEL[v.k]+'</span>' : '<span class="verdict inline">已披露 · 无预期值可比</span>')
        + (v ? '<span class="pill" style="margin-left:5px">预期差 '+(v.s>=0?"+":"")+v.s.toFixed(1)+'%</span>' : '')
        + '</div>';
  h += '<div class="etab act">'
     +   '<div class="erow eh"><span>指标</span><span>预期</span><span>实际</span><span>预期差</span></div>';
  metrics.forEach(m=>{
    const d = pct(m.a, m.e);
    h += '<div class="erow"><span class="ek">'+esc(m.k)+'</span>'
       +   '<span class="ev">'+(m.e===null?"—":fmtNum(m.e))+(m.e!==null&&m.u?'<em>'+esc(m.u)+'</em>':'')+'</span>'
       +   '<span class="ev">'+(m.a===null?"—":fmtNum(m.a))+(m.a!==null&&m.u?'<em>'+esc(m.u)+'</em>':'')+'</span>'
       +   '<span class="ey'+(d!==null&&d<0?' neg':'')+'" style="'+(d!==null&&d<0?'color:#0B7A56':(d!==null?'color:#C0392B':''))+'">'
       +   (d===null?"—":(d>=0?"+":"")+d.toFixed(1)+"%")+'</span></div>';
  });
  h += '</div>';
  const rec = actOf(tkOf(e));
  if(rec && rec.note) h += '<div class="basis">'+esc(rec.note)+'</div>';
  else if(rec && rec.src) h += '<div class="basis">来源：'+esc(rec.src)+'</div>';
  h += '<div class="tg"><button data-fill="'+esc(e.co||"")+'">改实际业绩</button>'
     +   '<button data-import="'+esc(e.co||"")+'">从文件 / 网上获取</button></div>';
  return h;
}

function fmtNum(v){
  const a = Math.abs(v);
  if(a >= 10000) return (v/10000).toFixed(2)+" 万";
  if(a >= 100) return v.toFixed(0);
  if(a >= 1) return v.toFixed(2);
  return v.toFixed(3);
}

/* 股价反应：财报前收 → 当日 → 次日 */
function reactionHTML(e){
  const tk = tkOf(e);
  const q = quoteOf(tk);
  if(!q){
    return '<div class="ph">还没有股价数据<span>'
         + (tk ? "点下面按钮抓取（需要联网）；也可以手填或用文件导入。" : "这家没有股票代码，先补代码。")
         + '</span></div>'
         + (tk ? '<div class="tg"><button data-fetchq="'+esc(tk)+'">抓取股价</button>'
               + '<button data-fillq="'+esc(tk)+'">手动填股价</button></div>' : '');
  }
  const cls = x => x===null||x===undefined ? "" : (x>=0?"up":"down");
  const sgn  = x => x===null||x===undefined ? "—" : (x>=0?"+":"")+Number(x).toFixed(2)+"%";
  const pre = Number(q.pre||0), cur = Number(q.close||0), nxt = Number(q.next||0);
  const chg = (q.chg!==null && q.chg!==undefined) ? Number(q.chg) : (pre ? (cur/pre-1)*100 : null);
  const nch = (q.next_chg!==null && q.next_chg!==undefined) ? Number(q.next_chg) : (nxt && cur ? (nxt/cur-1)*100 : null);
  let h = '<div class="ract">'
    + '<div class="rcell"><span class="rk">财报前收</span><span class="rv">'+(pre?fmtNum(pre):"—")+'</span>'
    +   '<span class="rs">'+esc(q.report_date||e.d)+'</span></div>'
    + '<div class="rcell"><span class="rk">当日涨跌</span><span class="rv '+cls(chg)+'">'+sgn(chg)+'</span>'
    +   '<span class="rs">收 '+(cur?fmtNum(cur):"—")+'</span></div>'
    + '<div class="rcell"><span class="rk">次日涨跌</span><span class="rv '+cls(nch)+'">'+sgn(nch)+'</span>'
    +   '<span class="rs">收 '+(nxt?fmtNum(nxt):"—")+'</span></div>'
    + '</div>';
  const rel = (nch!==null?nch:chg);
  if(rel!==null){
    h += '<div class="rnote">公布后'+(nch!==null?"次日":"当日")+(rel>=0?"涨":"跌")
       + Math.abs(rel).toFixed(2)+'%，'+(rel>=0?"红盘收":"绿盘收")+'　·　'
       + '数据 '+esc(q.asof||"")+(q.src?"（"+esc(q.src)+"）":"")+'</div>';
  }
  h += '<div class="tg"><button data-fetchq="'+esc(tk)+'">重新抓取</button>'
     + '<button data-fillq="'+esc(tk)+'">手动修正</button></div>';
  return h;
}

function showReadonly(e, dayKey){
  state.sel = dayKey || e.d;
  const d = parseD(e.d);
  const metrics = metricsOf(e);
  const verdict = verdictFrom(metrics);
  const done = metrics.length > 0;
  const tk = tkOf(e);
  document.getElementById("drTitle").textContent = e.t;
  document.getElementById("drSub").textContent = d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"
    + (e.co ? "　"+(tk?tk+"　":"")+e.co : "");

  const m = coMeta(e.co);
  const st = e.status==="confirmed" ? ["公司公告 / IR 已确认","ok"]
           : e.status==="manual"    ? ["手动添加","me"]
           : ["按历史规律推算，官方未确认","est"];
  let h = '<div style="margin-bottom:2px"><span class="pill '+st[1]+'">'+st[0]+'</span>'
        + '<span class="pill" style="margin-left:5px">'+(done?"已披露":"未披露")+'</span>'
        + (verdict?'<span class="verdict '+verdict.k+'" style="margin-left:5px">'+VLABEL[verdict.k]+'</span>':'')
        + (m.market?'<span class="pill" style="margin-left:5px">'+esc(m.market)+'</span>':'')
        + '</div>';

  const ex = e.raw && e.raw.expect;
  const period = ex && ex.est && ex.est.period ? ex.est.period : "";
  let exIn = subHTML("01","估值与评级","", valHTML(e.raw))
           + subHTML("02","业绩预期", period, estHTML(e.raw))
           + subHTML("03","核心业务关注点","", focusHTML(e));
  h += secHTML("市场预期", exIn);
  h += secHTML("实际业绩", actualHTML(e), done ? "已更新" : "公布后自动比对");
  h += secHTML("股价表现", reactionHTML(e), tk||"");

  /* 详情页两种填写方式 */
  const nm = esc(e.co || m.name || "");
  h += '<div class="sec-h"><span>资料维护</span><i>两种来源，都能再改</i></div>'
     + '<div class="tg">'
     +   '<button data-import="'+nm+'" data-mode="file">从本地文件夹</button>'
     +   '<button data-import="'+nm+'" data-mode="web">从网上获取</button>'
     +   '<button data-coform="'+nm+'">手动编辑</button>'
     + '</div>'
     + '<div class="droptip">从文件夹读：支持拖入 json / csv / md / txt，或直接选一个目录。'
     + '从网上获取：填官网 IR 页或财报页链接，抓不到时会让你粘贴原文。写入后随时可改。</div>';

  if(e.n) h += '<div class="fld" style="margin-top:14px"><label>日程口径</label><div style="font-size:11.5px;color:#6e6e73;line-height:1.6">'+esc(e.n)+'</div></div>';
  h += '<div class="acts"><button class="ghost" id="roClose">关闭</button><button class="ghost" id="roAdd">在当天加备注</button></div>';
  h += '<div class="acts"><button class="ghost" id="roWatch" style="flex:1;color:#B4690E">管理关注公司</button>'
     + '<button class="ghost" id="roEditCo" style="flex:1">编辑公司资料</button></div>';
  if(e.customDate) h += '<div class="acts"><button class="danger" id="roDelDate" style="flex:1">删除这条财报日</button></div>';
  const body = document.getElementById("drBody");
  body.innerHTML = h;
  body.querySelectorAll("[data-coform]").forEach(b=>{
    b.onclick = ()=>openCoForm(b.dataset.coform);
  });
  body.querySelectorAll("[data-import]").forEach(b=>{
    b.onclick = ()=>openImport(b.dataset.import, b.dataset.mode||"file");
  });
  body.querySelectorAll("[data-fill]").forEach(b=>{
    b.onclick = ()=>openFillActual(b.dataset.fill);
  });
  body.querySelectorAll("[data-fetchq]").forEach(b=>{
    b.onclick = ()=>fetchQuote(b.dataset.fetchq, ()=>showReadonly(e, dayKey));
  });
  body.querySelectorAll("[data-fillq]").forEach(b=>{
    b.onclick = ()=>openFillQuote(b.dataset.fillq);
  });
  document.getElementById("roClose").onclick = closeDrawer;
  document.getElementById("roAdd").onclick = ()=>openForm(null, e.d);
  document.getElementById("roWatch").onclick = openWatch;
  document.getElementById("roEditCo").onclick = ()=>openCoForm(e.co);
  const dd = document.getElementById("roDelDate");
  if(dd) dd.onclick = ()=>{
    const ov = state.co[e.co] || {};
    const left = (ov.earnings||[]).filter((x,i)=>i!==e.ci);
    state.co[e.co] = Object.assign({}, ov, {earnings:left});
    save(); renderSidebar(); render(); closeDrawer();
    toast("已删除这条财报日");
  };
  openDrawer();
}

function openForm(e, dayKey){
  const isNew = !e;
  const base = e || {d:dayKey, s:"09:00", e:"10:00", t:"", c:"personal", a:false, n:"", remind:0};
  state.editing = isNew ? null : e.id;
  const d = parseD(base.d);
  document.getElementById("drTitle").textContent = isNew ? "新建事件" : "编辑事件";
  document.getElementById("drSub").textContent = d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";

  let opts = "";
  /* 六个分类都列出来：自建事件也能归到「财经事件 / 财报日历」，
     只是不会带官方日程那套只读详情，点开仍是这个编辑表单 */
  const cats = CALORDER.slice();
  cats.forEach(k=>{
    opts += '<option value="'+k+'"'+(base.c===k?" selected":"")+'>'+CALS[k].n+'</option>';
  });
  const remOpts = [[0,"不提醒"],[0,"准时"],[5,"提前 5 分钟"],[15,"提前 15 分钟"],[30,"提前 30 分钟"],[60,"提前 1 小时"],[1440,"提前 1 天"]];
  let rsel = "";
  [[0,"不提醒"],[5,"提前 5 分钟"],[15,"提前 15 分钟"],[30,"提前 30 分钟"],[60,"提前 1 小时"],[1440,"提前 1 天"]].forEach(([v,l])=>{
    rsel += '<option value="'+v+'"'+((base.remind||0)===v?" selected":"")+'>'+l+'</option>';
  });

  let h = '<div class="fld"><label>标题</label><input type="text" id="fTitle" value="'+esc(base.t)+'" placeholder="例如：腾讯财报电话会"></div>'
        + '<div class="fld"><label>日期</label><input type="date" id="fDate" value="'+base.d+'"></div>'
        + '<div class="fld"><label class="sw"><input type="checkbox" id="fAll"'+(base.a?" checked":"")+'>全天</label></div>'
        + '<div class="row2" id="fTimes"><div class="fld"><label>开始</label><input type="time" id="fStart" value="'+(base.s||"09:00")+'"></div>'
        + '<div class="fld"><label>结束</label><input type="time" id="fEnd" value="'+(base.e||"10:00")+'"></div></div>'
        + '<div class="fld"><label>日历</label><select id="fCal">'+opts+'</select></div>'
        + '<div class="fld"><label>提醒</label><select id="fRemind">'+rsel+'</select>'
        + '<div class="hint" style="margin-top:5px">需要允许通知权限；页面关闭后不生效。</div></div>'
        + '<div class="fld"><label>备注</label><textarea id="fNote" placeholder="可选">'+esc(base.n)+'</textarea></div>'
        + '<div class="acts"><button class="primary" id="fSave">保存</button><button class="ghost" id="fCancel">取消</button></div>';
  if(!isNew) h += '<div class="acts"><button class="danger" id="fDel">删除事件</button></div>';

  const body = document.getElementById("drBody");
  body.innerHTML = h;
  openDrawer();
  setTimeout(()=>document.getElementById("fTitle").focus(), 60);

  const allBox = document.getElementById("fAll"), times = document.getElementById("fTimes");
  const sync = ()=>{ times.style.display = allBox.checked ? "none" : "flex"; };
  allBox.onchange = sync; sync();

  document.getElementById("fCancel").onclick = ()=>{ isNew ? closeDrawer() : selectDay(base.d); };
  if(!isNew) document.getElementById("fDel").onclick = ()=>{
    state.events = state.events.filter(x=>x.id!==e.id);
    save(); render(); selectDay(base.d); toast("已删除");
  };
  document.getElementById("fSave").onclick = ()=>{
    const t = document.getElementById("fTitle").value.trim();
    if(!t){ toast("请填写标题"); return; }
    const a = allBox.checked;
    const obj = {
      id: isNew ? "u"+Date.now() : e.id,
      d: document.getElementById("fDate").value,
      s: a ? "" : document.getElementById("fStart").value,
      e: a ? "" : document.getElementById("fEnd").value,
      t, a,
      c: document.getElementById("fCal").value,
      n: document.getElementById("fNote").value.trim(),
      remind: Number(document.getElementById("fRemind").value)||0
    };
    if(e && e.gid) obj.gid = e.gid;
    if(!a && obj.s && obj.e && obj.e < obj.s){ toast("结束时间早于开始时间"); return; }
    if(isNew) state.events.push(obj);
    else state.events = state.events.map(x=>x.id===e.id?obj:x);
    save();
    if(obj.remind>0) askPermission();
    render();
    if(state.mode==="month"||state.mode==="day"){ state.sel = obj.d; selectDay(obj.d); } else { toast("已保存"); closeDrawer(); }
    toast("已保存");
  };
}

function openDrawer(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("veil").classList.add("on");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("veil").classList.remove("on");
  state.editing = null;
}

/* ── 提醒 ───────────────────────────── */
function askPermission(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default") Notification.requestPermission();
}
function checkReminders(){
  const now = Date.now();
  state.events.forEach(e=>{
    if(!e.remind || e.a || !e.s) return;
    const start = new Date(e.d+"T"+e.s+":00").getTime();
    if(isNaN(start)) return;
    const at = start - e.remind*60000;
    const sig = e.id+"@"+e.d;
    if(now>=at && now<start && state.fired.indexOf(sig)<0){
      state.fired.push(sig); save();
      const msg = e.t+(e.remind? "（"+e.remind+" 分钟后开始）" : " 现在开始");
      toast("提醒："+msg);
      try{
        if(window.Notification && Notification.permission==="granted"){
          new Notification("日历提醒", {body: msg});
        }
      }catch(err){}
    }
  });
}
setInterval(checkReminders, 20000);
setTimeout(checkReminders, 1200);

function exportReminders(){
  const now = Date.now();
  const rows = state.events.map(e=>{
    if(e.a||!e.s) return null;
    const ts = new Date(e.d+"T"+e.s+":00").getTime();
    if(isNaN(ts)||ts<now) return null;
    return {e, ts};
  }).filter(Boolean).sort((a,b)=>a.ts-b.ts);

  if(!rows.length){ toast("没有未来带时间的事件"); return; }
  let txt = "【日历提醒清单】\n";
  rows.forEach(({e,ts})=>{
    const d = new Date(ts);
    txt += d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())
         + "  "+e.t + (e.remind? "（提前 "+e.remind+" 分钟）":"") + "\n";
  });
  txt += "—— 共 "+rows.length+" 条";
  navigator.clipboard.writeText(txt).then(()=>toast("已复制，发给 WorkBuddy 即可建提醒"),()=>{
    const w = window.open("", "_blank");
    if(w){ w.document.write("<pre style='font:13px/1.6 -apple-system;padding:20px'>"+esc(txt)+"</pre>"); }
  });
}

let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("on"), 2400);
}

/* ── 导航与交互 ─────────────────────── */
function shift(dir){
  const v = state.view;
  if(state.mode==="month") state.view = new Date(v.getFullYear(), v.getMonth()+dir, 1);
  else if(state.mode==="year") state.view = new Date(v.getFullYear()+dir, v.getMonth(), 1);
  else if(state.mode==="week") state.view = new Date(v.getFullYear(), v.getMonth(), v.getDate()+7*dir);
  else {
    const d = parseD(state.sel);
    const nd = new Date(d.getFullYear(), d.getMonth(), d.getDate()+dir);
    state.sel = fmt(nd); state.view = nd;
  }
  render();
}
document.getElementById("prev").onclick = ()=>shift(-1);
document.getElementById("next").onclick = ()=>shift(1);
function gotoToday(){
  const t = parseD(TODAY);
  state.view = t; state.sel = TODAY; render();
}
document.getElementById("today").onclick = gotoToday;
document.getElementById("btnToday2").onclick = gotoToday;
document.getElementById("mnPrev").onclick = ()=>{ state.view = new Date(state.view.getFullYear(), state.view.getMonth()-1, 1); render(); };
document.getElementById("mnNext").onclick = ()=>{ state.view = new Date(state.view.getFullYear(), state.view.getMonth()+1, 1); render(); };
document.getElementById("drClose").onclick = closeDrawer;
document.getElementById("veil").onclick = closeDrawer;
document.getElementById("btnAdd").onclick = ()=>openForm(null, state.sel);
document.getElementById("btnMacroMob").onclick = ()=>openMacro();

document.getElementById("btnExp").onclick = ()=>{
  const data = JSON.stringify({
    v:4, exportedAt:new Date().toISOString(), app:"财经日历",
    events: state.events, hidden:[...state.hidden],
    co: state.co, fired: state.fired,
    subs: state.subs, myact: MYACT, myq: MYQ, myrel: MYREL
  }, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  a.download = "财经日历备份-"+TODAY+".json";
  a.click();
  toast("已导出（含关注公司与自定义事件）");
};
document.getElementById("btnImp").onclick = ()=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const o = JSON.parse(r.result);
        if(!Array.isArray(o.events)) throw new Error("no events");
        const nco = o.co ? Object.keys(o.co).filter(k=>!o.co[k].deleted && (o.co[k].custom || o.co[k].focus || o.co[k].ticker)).length : 0;
        if(!confirm("将用备份覆盖本机数据：\n事件 "+o.events.length+" 条"+(nw?"、自定义公司/资料 "+nw+" 家":"")+"\n\n本机现有改动会被替换，继续？")) return;
        state.events = o.events.map(migrate);
        state.hidden = new Set(o.hidden||[]);
        state.co = o.co || {};
        state.fired = o.fired||[];
        if(Array.isArray(o.subs)) state.subs = o.subs;
        if(o.myact) MYACT = o.myact;
        if(o.myq) MYQ = o.myq;
        if(o.myrel) MYREL = o.myrel;
        save(); renderSidebar(); render();
        toast("已导入 "+o.events.length+" 个事件");
      }catch(e){ toast("文件格式不对"); }
    };
    r.readAsText(f);
  };
  inp.click();
};
document.getElementById("btnRst").onclick = ()=>{
  if(!confirm("恢复出厂设置？\n本机添加/修改的事件、隐藏分类、关注公司名单都会清空，回到初始数据。\n（建议先「导出」备份）")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  state.events = SEED.map(e=>migrate({...e, remind:0})).map((e,i)=>({id:"s"+i, ...e}));
  state.fired = []; state.hidden = new Set();
  state.co = {};
  state.subs = DEFAULT_SUBS.slice();
  MYACT = {}; MYQ = {}; MYREL = {};
  save(); renderSidebar(); render();
  toast("已重置为初始数据");
};

document.querySelectorAll("#seg button").forEach(b=>{
  b.onclick = ()=>{
    state.mode = b.dataset.v;

    if(state.mode==="day") state.view = parseD(state.sel);
    render();

});

const q = document.getElementById("q"), sres = document.getElementById("sres");
q.oninput = ()=>{
  const kw = q.value.trim().toLowerCase();
  if(!kw){ sres.classList.remove("on"); return; }
  const hits = allEvents().filter(e=>e.t.toLowerCase().includes(kw)).slice(0,20);
  if(!hits.length){ sres.innerHTML = '<div class="it" style="color:#a1a1a6">没有匹配</div>'; sres.classList.add("on"); return; }
  sres.innerHTML = hits.map(e=>'<div class="it" data-d="'+e.d+'">'+esc(e.t)+'<span>'+e.d+'</span></div>').join("");
  sres.classList.add("on");
  sres.querySelectorAll(".it").forEach(el=>{
    el.onclick = ()=>{
      const d = parseD(el.dataset.d);
      state.view = d; state.sel = el.dataset.d;
      sres.classList.remove("on"); q.value="";
      render(); selectDay(el.dataset.d);
    };
  });
};
document.addEventListener("click", e=>{
  if(!e.target.closest(".search")) sres.classList.remove("on");
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeDrawer();
  if(e.key==="ArrowLeft" && !e.metaKey && document.activeElement.tagName!=="INPUT") shift(-1);
  if(e.key==="ArrowRight" && !e.metaKey && document.activeElement.tagName!=="INPUT") shift(1);
});
